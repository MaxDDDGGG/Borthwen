{% extends "base.html" %}
{% block content %}
<header class="relative bg-slate-900 text-white py-28 px-4 overflow-hidden min-h-[500px] flex items-center justify-center">
    <!-- Slideshow Background Container -->
    <div id="hero-slideshow" class="absolute inset-0 z-0">
        <!-- Slide 1 -->
        <div class="hero-slide absolute inset-0 opacity-40 bg-cover bg-center transition-opacity duration-1000 ease-in-out" 
             style="background-image: url('/static/bnbOutside.png');"></div>
        <!-- Slide 2 -->
        <div class="hero-slide absolute inset-0 opacity-0 bg-cover bg-center transition-opacity duration-1000 ease-in-out" 
             style="background-image: url('/static/mountainview.png');"></div>
        <!-- Slide 3 -->
        <div class="hero-slide absolute inset-0 opacity-0 bg-cover bg-center transition-opacity duration-1000 ease-in-out" 
             style="background-image: url('/static/terrace.png');"></div>
    </div>
        <div class="hero-slide absolute inset-0 opacity-0 bg-cover bg-center transition-opacity duration-1000 ease-in-out" 
             style="background-image: url('/static/octopus.png');"></div>
    </div>

    <!-- Dark Overlay for Readability -->
    <div class="absolute inset-0 bg-slate-950/40 z-10"></div>

    <!-- Hero Content -->
    <div class="relative z-20 max-w-4xl mx-auto text-center space-y-6">
        <h1 class="text-4xl md:text-6xl font-serif font-bold tracking-wide drop-shadow-md">
            Luxury Accommodation in Dolgellau
        </h1>
        <p class="text-lg md:text-xl text-slate-100 max-w-2xl mx-auto drop-shadow-sm">
            Nestled at the foot of Cader Idris with panoramic views of the Mawddach Valley and mountains beyond.
        </p>
        <div class="pt-4">
            <a href="/booking" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-8 py-4 rounded-lg shadow-lg text-lg transition inline-block">
                Check Live Availability & Rates
            </a>
        </div>
    </div>
</header>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const slides = document.querySelectorAll(".hero-slide");
        if (slides.length <= 1) return;

        let currentSlide = 0;
        const slideInterval = 5000; // Time per slide in milliseconds (5 seconds)

        setInterval(() => {
            // Fade out current slide
            slides[currentSlide].classList.remove("opacity-40");
            slides[currentSlide].classList.add("opacity-0");

            // Advance to next slide index
            currentSlide = (currentSlide + 1) % slides.length;

            // Fade in next slide
            slides[currentSlide].classList.remove("opacity-0");
            slides[currentSlide].classList.add("opacity-40");
        }, slideInterval);
    });
</script>
{% endblock %}
